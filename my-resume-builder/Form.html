<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCV Builder | Create Your Resume</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0f172a; --accent: #10b981; --bg: #f1f5f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1e293b; }
        .navbar { background: var(--primary); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; color: white; }
        .logo { font-weight: 800; color: var(--accent); font-size: 1.2rem; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        .steps-bar { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; }
        .step-circle { width: 40px; height: 40px; background: #cbd5e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; z-index: 2; }
        .step-circle.active { background: var(--accent); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .form-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { margin-bottom: 20px; color: var(--primary); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
        input:focus { border-color: var(--accent); outline: none; background: #f0fdf4; }
        .btn-group { margin-top: 30px; display: flex; justify-content: space-between; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
        .btn-next { background: var(--accent); color: white; }
        .btn-prev { background: #e2e8f0; color: #475569; }
        .btn-save { background: var(--primary); color: white; margin-right: 10px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">SwiftCV Builder</div>
    <a href="index.html" style="color: white; text-decoration: none; font-size: 0.9rem;">Back to Home</a>
</nav>

<div class="container">
    <div class="steps-bar">
        <div class="step-circle active" id="s1">1</div>
        <div class="step-circle" id="s2">2</div>
        <div class="step-circle" id="s3">3</div>
    </div>

    <div class="form-card">
        <form id="resumeForm">
            <div class="form-section active" id="step1">
                <h2 id="formTitle">Personal Information</h2>
                <div class="grid">
                    <div><label>Full Name</label><input type="text" id="fullName" placeholder="John Doe"></div>
                    <div><label>Job Title</label><input type="text" id="jobTitle" placeholder="Software Engineer"></div>
                    <div class="full-width"><label>Email Address</label><input type="email" id="email" placeholder="john@example.com"></div>
                    <div class="full-width"><label>Summary</label><textarea id="summary" rows="4"></textarea></div>
                </div>
            </div>

            <div class="form-section" id="step2">
                <h2>Education & Skills</h2>
                <div class="grid">
                    <div class="full-width"><label>Highest Degree</label><input type="text" id="degree" placeholder="Bachelors in CS"></div>
                    <div class="full-width"><label>Skills (Comma separated)</label><input type="text" id="skills" placeholder="React, Node.js, SQL"></div>
                </div>
            </div>

            <div class="form-section" id="step3">
                <h2>Finalize Resume</h2>
                <p>All set! You can now sync your data to the cloud and download your professional resume.</p>
                <div style="margin-top: 20px; padding: 20px; border: 1px dashed #cbd5e1; border-radius: 10px;">
                    <p><strong>Cloud Status:</strong> Ready for Sync</p>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-prev" id="prevBtn" onclick="changeStep(-1)" style="visibility: hidden;">Previous</button>
                <div>
                    <button type="button" class="btn btn-save" onclick="syncResumeData()">☁️ Sync to Cloud</button>
                    <button type="button" class="btn btn-next" id="nextBtn" onclick="changeStep(1)">Next Step</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    let currentStep = 1;
    const totalSteps = 3;
    let editId = new URLSearchParams(window.location.search).get('edit');

    const _supabase = supabase.createClient(
        'https://choosnjwckopmfunzccb.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNob29zbmp3Y2tvcG1mdW56Y2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MzEzOTUsImV4cCI6MjA4NTQwNzM5NX0.tWMtkjpAdUAV0dkU9ICdZariMOxwjtMUItWPrRXBpTU'
    );

    async function checkEditMode() {
        if (editId) {
            const { data, error } = await _supabase.from('resumes').select('*').eq('id', editId).single();
            if (data) {
                const content = JSON.parse(data.content);
                document.getElementById('fullName').value = content.name || '';
                document.getElementById('jobTitle').value = content.title || '';
                document.getElementById('email').value = content.email || '';
                document.getElementById('summary').value = content.summary || '';
                document.getElementById('degree').value = content.education || '';
                document.getElementById('skills').value = content.skills || '';
                document.getElementById('formTitle').innerText = "Editing Resume";
            }
        }
    }

    function changeStep(n) {
        document.getElementById(`step${currentStep}`).classList.remove('active');
        document.getElementById(`s${currentStep}`).classList.remove('active');
        currentStep += n;
        document.getElementById(`step${currentStep}`).classList.add('active');
        document.getElementById(`s${currentStep}`).classList.add('active');
        document.getElementById('prevBtn').style.visibility = currentStep === 1 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').innerText = currentStep === totalSteps ? 'Download PDF' : 'Next Step';
        if (currentStep > totalSteps) { window.print(); currentStep = totalSteps; }
    }

    async function syncResumeData() {
        const resumeData = {
            name: document.getElementById('fullName').value,
            title: document.getElementById('jobTitle').value,
            email: document.getElementById('email').value,
            summary: document.getElementById('summary').value,
            education: document.getElementById('degree').value,
            skills: document.getElementById('skills').value
        };

        let res;
        if (editId) {
            res = await _supabase.from('resumes').update({ title: resumeData.name, content: JSON.stringify(resumeData) }).eq('id', editId);
        } else {
            res = await _supabase.from('resumes').insert([{ title: resumeData.name, content: JSON.stringify(resumeData) }]);
        }

        if (res.error) {
            alert("Error: " + res.error.message);
        } else {
            alert("🎉 Success! Resume synced to Cloud.");
            window.location.href = "index.html";
        }
    }

    checkEditMode();
</script>
</body>
</html>
